# BiomeFUN_2025: Conda environment for running COBRA and Equilibrator tools during the course

name: BiomeFUN_2025
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.9
  - notebook=6.5.6
  - ipykernel
  - pandas=1.5.3
  - sqlalchemy=1.4.49
  - plotly=5.15.0
  - pip
  - pip:
      - equilibrator-api==0.6.0
      - equilibrator-pathway==0.6.0
      - equilibrator-cache==0.6.1
      - kaleido
      - pymupdf
      - cobra==0.29.1
      - xlrd==2.0.2

